# AgriKafka-Agent — Docker Compose (Local Single-Broker KRaft Dev Profile)
# Architecture Reference: docs/decisions/ADR-0002-kafka-broker-and-client.md
# Topology Reference: docs/architecture/KAFKA_TOPOLOGY.md

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: agrikafka-broker-dev
    hostname: kafka
    restart: unless-stopped
    ports:
      # Host access strictly bound to localhost (127.0.0.1)
      - "127.0.0.1:9092:9092"
    environment:
      # KRaft Controller & Broker Role Setup (Zero ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # Dev Profile Replication Settings (Single Broker)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Enforce Declarative Topic Governance
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Workstation Memory Limits (~350MB heap)
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
    volumes:
      # Persistent named volume for message durability across restarts
      - kafka_dev_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - agri-network

  stream-processor:
    build:
      context: ../..
      dockerfile: services/stream-processor/Dockerfile
    container_name: agrikafka-stream-processor
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_SENSOR_READINGS: agri.sensor-readings
      KAFKA_TOPIC_WEATHER_DATA: agri.weather-data
      KAFKA_TOPIC_VALIDATED_OBSERVATIONS: agri.validated-observations
      KAFKA_TOPIC_DEAD_LETTER_QUEUE: agri.dead-letter-queue
      SPARK_CHECKPOINT_DIR: /opt/spark/checkpoints
      SPARK_WATERMARK_DURATION: "10 minutes"
      SPARK_TUMBLING_WINDOW: "5 minutes"
      SPARK_TRIGGER_INTERVAL: "5 seconds"
    volumes:
      - spark_checkpoints:/opt/spark/checkpoints
    networks:
      - agri-network

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: agrikafka-timescaledb
    hostname: timescaledb
    restart: unless-stopped
    ports:
      # Host access strictly bound to localhost (127.0.0.1)
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrikafka}
      POSTGRES_USER: ${POSTGRES_USER:-agri_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agri_dev_password_insecure}
      TS_TUNE_MEMORY: "512MB"
      TS_TUNE_NUM_CPUS: "2"
    volumes:
      # Persistent named volume for TimescaleDB / PostgreSQL data
      - timescale_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-agri_admin} -d $${POSTGRES_DB:-agrikafka} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - agri-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: agrikafka-prometheus
    hostname: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - agri-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: agrikafka-grafana
    hostname: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - timescaledb
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-agri_admin_dev_insecure}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - agri-network

volumes:
  kafka_dev_data:
    name: agrikafka_dev_data
  spark_checkpoints:
    name: agrikafka_spark_checkpoints
  timescale_dev_data:
    name: agrikafka_timescale_dev_data
  prometheus_data:
    name: agrikafka_prometheus_data
  grafana_data:
    name: agrikafka_grafana_data

networks:
  agri-network:
    name: agrikafka_network
    driver: bridge
