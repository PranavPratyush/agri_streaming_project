[project]
name = "agri-stream-processor"
version = "0.1.0"
description = "AgriKafka-Agent PySpark Structured Streaming Service: Watermarking, Windowing, Deduplication, and Features"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pandas>=2.0.0",
    "agri-event-contracts",
]

[tool.uv.sources]
agri-event-contracts = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

