[project]
name = "agri-investigator"
version = "0.1.0"
description = "AgriKafka-Agent Multi-Agent Alert Investigation Architecture"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AgriKafka Engineering Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "agri-event-contracts",
    "agri-shared",
    "agri-agronomy-rag",
    "agri-persistence",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agri_investigator"]

