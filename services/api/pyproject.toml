[project]
name = "agri-api"
version = "0.1.0"
description = "AgriKafka-Agent FastAPI Backend Service"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AgriKafka Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "agri-event-contracts",
    "agri-persistence",
    "agri-shared",
    "agri-investigator",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agri_api"]

