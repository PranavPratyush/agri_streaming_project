[project]
name = "agri-notifications"
version = "0.1.0"
description = "AgriKafka-Agent Notification Worker and Human Feedback Service"
authors = [
    { name = "Aanish Khan" },
    { name = "Daksh Chauhan" },
    { name = "Pranav Pratyush" }
]
requires-python = ">=3.11"
dependencies = [
    "agri-shared",
    "agri-persistence",
    "agri-event-contracts",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agri_notifications"]

