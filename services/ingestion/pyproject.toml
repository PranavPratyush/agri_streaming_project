[project]
name = "agri-ingestion"
version = "0.1.0"
description = "AgriKafka-Agent Ingestion Service: Live Connectors, Context, Replay, and Injected Harness"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.5.0",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "agri-event-contracts",
]

[tool.uv.sources]
agri-event-contracts = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
