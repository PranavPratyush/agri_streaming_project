[project]
name = "agri-event-contracts"
version = "0.1.0"
description = "Canonical event contracts, schemas, and validation utilities for AgriKafka-Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aanish Khan" },
    { name = "Daksh Chauhan" },
    { name = "Pranav Pratyush" }
]
dependencies = [
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agri_contracts"]
