[project]
name = "agri-persistence"
version = "0.1.0"
description = "TimescaleDB / PostgreSQL persistence client, connection pool, repositories, and query layer for AgriKafka-Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aanish Khan" },
    { name = "Daksh Chauhan" },
    { name = "Pranav Pratyush" }
]
dependencies = [
    "agri-event-contracts",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agri_persistence"]

