[project]
name = "agri-shared"
version = "0.1.0"
description = "Shared Python utilities, metrics instrumentation, logging, and helpers for AgriKafka-Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aanish Khan" },
    { name = "Daksh Chauhan" },
    { name = "Pranav Pratyush" }
]
dependencies = [
    "prometheus-client>=0.20.0",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agri_shared"]

