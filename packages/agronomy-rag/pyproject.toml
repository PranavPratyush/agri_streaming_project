[project]
name = "agri-agronomy-rag"
version = "0.1.0"
description = "AgriKafka-Agent Agronomy Knowledge Base & Grounded Retrieval Service"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AgriKafka-Agent Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "chromadb>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agri_agronomy_rag"]

